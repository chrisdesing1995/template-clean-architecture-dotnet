name: build-and-test

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore TemplateProject.sln

      - name: Build
        run: dotnet build TemplateProject.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test TemplateProject.sln --configuration Release --no-build --verbosity normal
